<body class="bg-surface text-on-surface min-h-screen flex items-center justify-center font-body-md">
<!-- Main Container -->
<div class="w-full max-w-[1280px] mx-auto px-margin-mobile md:px-margin-desktop py-xl flex flex-col md:flex-row gap-xl md:gap-[64px] min-h-screen items-center">
<!-- Left Side: Branding & Image -->
<div class="hidden md:flex flex-col w-full md:w-1/2 justify-center">
<h1 class="font-display-lg text-display-lg text-primary mb-md">Join EduSphere</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant mb-xl max-w-md">
                Begin your journey towards career progression and deep knowledge. A structured, architectural learning experience awaits.
            </p>
<div class="rounded-xl overflow-hidden shadow-lg border border-surface-variant" style="aspect-ratio: 4/3;">
<img class="w-full h-full object-cover" data-alt="A modern, high-end corporate learning environment. A sophisticated professional space with abundant natural light, architectural lines, and clean minimalist furniture. The color palette is strictly deep blacks, pristine whites, and vibrant electric teal accents. The atmosphere is focused, intentional, and premium, evoking a sense of forward momentum and modern education." src="https://lh3.googleusercontent.com/aida-public/AB6AXuAEqyXoaeJV9UyT2Y03KW7HluWuVQRzMGkVHum1b2-mV2rgdidGDIAUWgTB8BQKvGf3Yk6T-pLDY0Q9hnbWuVY456kWvuier-LaYwzs9-o5-IcEjuBQfuzOEVcxWW7sHfl6CGfxgtNKXGGVu0rL7_KrWHnisottr4ZBoKFvuczybuRkxehTy33nwNNslZMd5a1m5W-TyH-j9p4mfaM9w4FLUZ9CqiRuHfVANCuB7JgSw_GIQ-B4pDYSlA"/>
</div>
</div>
<!-- Right Side: Registration Form Container -->
<div class="w-full md:w-1/2 max-w-[480px] bg-surface-container-lowest rounded-xl shadow-lg p-margin-mobile md:p-xl border border-surface-variant mx-auto">
<div class="text-center md:text-left mb-xl">
<h2 class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-primary mb-xs">Create Account</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Already have an account? <a class="text-secondary font-medium hover:underline" href="#">Log in</a></p>
</div>
<form class="flex flex-col gap-lg">
<!-- Role Selection -->
<div>
<label class="font-label-md text-label-md text-on-surface block mb-base">I am joining as a:</label>
<div class="flex gap-sm">
<label class="flex-1 cursor-pointer">
<input checked="" class="peer sr-only" name="role" type="radio" value="student"/>
<div class="flex items-center justify-center p-sm border border-outline-variant rounded-lg bg-surface-container-lowest peer-checked:border-secondary peer-checked:bg-secondary-container/10 peer-checked:text-secondary transition-colors">
<span class="material-symbols-outlined mr-base text-[20px]">school</span>
<span class="font-label-md text-label-md font-semibold">Student</span>
</div>
</label>
<label class="flex-1 cursor-pointer">
<input class="peer sr-only" name="role" type="radio" value="instructor"/>
<div class="flex items-center justify-center p-sm border border-outline-variant rounded-lg bg-surface-container-lowest peer-checked:border-secondary peer-checked:bg-secondary-container/10 peer-checked:text-secondary transition-colors">
<span class="material-symbols-outlined mr-base text-[20px]">co_present</span>
<span class="font-label-md text-label-md font-semibold">Instructor</span>
</div>
</label>
</div>
</div>
<!-- Full Name -->
<div>
<label class="font-label-md text-label-md text-on-surface block mb-xs" for="fullName">Full Name</label>
<div class="relative">
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg px-sm py-sm text-on-surface font-body-md focus:outline-none focus:border-secondary focus:ring-1 focus:ring-secondary transition-colors" id="fullName" placeholder="Jane Doe" type="text"/>
</div>
</div>
<!-- Email -->
<div>
<label class="font-label-md text-label-md text-on-surface block mb-xs" for="email">Email Address</label>
<div class="relative">
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg px-sm py-sm text-on-surface font-body-md focus:outline-none focus:border-secondary focus:ring-1 focus:ring-secondary transition-colors" id="email" placeholder="jane@example.com" type="email"/>
</div>
</div>
<!-- Password -->
<div>
<label class="font-label-md text-label-md text-on-surface block mb-xs" for="password">Password</label>
<div class="relative">
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg px-sm py-sm text-on-surface font-body-md focus:outline-none focus:border-secondary focus:ring-1 focus:ring-secondary transition-colors" id="password" placeholder="••••••••" type="password"/>
</div>
</div>
<!-- Terms -->
<div class="flex items-start gap-sm">
<input class="mt-1 rounded border-outline-variant text-secondary focus:ring-secondary bg-surface-container-lowest" id="terms" type="checkbox"/>
<label class="font-label-sm text-label-sm text-on-surface-variant font-normal" for="terms">
                        I agree to the <a class="text-secondary hover:underline" href="#">Terms of Service</a> and <a class="text-secondary hover:underline" href="#">Privacy Policy</a>.
                    </label>
</div>
<!-- Submit Button -->
<button class="w-full bg-primary text-on-primary py-sm rounded-lg font-label-md text-label-md font-semibold hover:bg-primary/90 transition-colors flex justify-center items-center gap-base mt-xs" type="button">
                    Create Account
                </button>
<!-- Divider -->
<div class="relative flex items-center py-base">
<div class="flex-grow border-t border-surface-variant"></div>
<span class="flex-shrink-0 mx-4 text-on-surface-variant font-label-sm text-label-sm uppercase">or continue with</span>
<div class="flex-grow border-t border-surface-variant"></div>
</div>
<!-- Social Login -->
<button class="w-full bg-surface-container-lowest border border-outline-variant text-on-surface py-sm rounded-lg font-label-md text-label-md font-medium hover:bg-surface-container transition-colors flex justify-center items-center gap-base" type="button">
<!-- Google G Logo SVG -->
<svg class="w-5 h-5" viewbox="0 0 24 24">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
</svg>
                    Google
                </button>
</form>
</div>
</div>
</body></html>
