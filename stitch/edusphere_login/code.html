</div>

<div class="flex justify-between items-center">
<label class="font-label-md text-label-md text-on-surface" for="password">Password</label>
<a class="font-label-md text-label-md text-secondary hover:text-secondary-container transition-colors" href="#">Forgot Password?</a>
</div>

</div>
<button class="w-full bg-primary text-on-primary font-label-md text-label-md py-sm rounded-lg hover:bg-surface-tint transition-colors mt-base" type="submit">

            </button>
</form>
