<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-primary mb-xs">Quiz Builder</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Create an engaging assessment for your students.</p>
</div>
<!-- Section 1: Quiz Details -->
<section class="bg-surface-container-lowest shadow-[0px_4px_12px_0px_rgba(0,0,0,0.1)] rounded-xl p-lg mb-xl border border-surface-variant">
<div class="mb-md">
<label class="block font-label-md text-label-md text-on-surface mb-xs" for="quiz-title">Quiz Title</label>
<input class="w-full bg-surface-container-lowest border border-outline rounded-lg px-md py-sm font-body-md text-body-md text-on-surface focus:outline-none focus:border-secondary focus:ring-1 focus:ring-secondary transition-colors" id="quiz-title" placeholder="e.g., Introduction to React Fundamentals" type="text"/>
</div>
<div>
<label class="block font-label-md text-label-md text-on-surface mb-xs" for="quiz-desc">Description (Optional)</label>
<textarea class="w-full bg-surface-container-lowest border border-outline rounded-lg px-md py-sm font-body-md text-body-md text-on-surface focus:outline-none focus:border-secondary focus:ring-1 focus:ring-secondary transition-colors resize-none" id="quiz-desc" placeholder="Briefly describe what this quiz covers..." rows="2"></textarea>
</div>
</section>
<!-- Section 2: Question List -->
<section class="space-y-lg mb-xl">
<div class="flex items-center justify-between">
<h2 class="font-headline-md text-headline-md text-primary">Questions</h2>
<span class="font-label-md text-label-md text-on-surface-variant bg-surface-variant px-sm py-xs rounded-full">1 Question</span>
</div>
<!-- Question Card 1 -->
<div class="bg-surface-container-lowest shadow-[0px_4px_12px_0px_rgba(0,0,0,0.1)] rounded-xl relative border border-surface-variant">
<div class="absolute top-0 left-0 w-full h-1 bg-secondary rounded-t-xl"></div>
<div class="p-lg">
<div class="flex items-start justify-between mb-md">
<h3 class="font-label-md text-label-md text-on-surface-variant">Question 1</h3>
<div class="flex gap-sm">
<button class="text-outline hover:text-primary transition-colors">
<span class="material-symbols-outlined text-[20px]" data-icon="content_copy">content_copy</span>
</button>
<button class="text-outline hover:text-error transition-colors">
<span class="material-symbols-outlined text-[20px]" data-icon="delete">delete</span>
</button>
</div>
</div>
<div class="mb-lg">
<textarea class="w-full bg-surface-container-lowest border border-outline rounded-lg px-md py-sm font-body-md text-body-md text-on-surface focus:outline-none focus:border-secondary focus:ring-1 focus:ring-secondary transition-colors resize-none" placeholder="Enter your question here..." rows="2"></textarea>
</div>
<div class="space-y-sm">
<!-- Option A -->
<div class="flex items-center gap-md p-sm border border-outline-variant rounded-lg hover:border-secondary-fixed-dim transition-colors group">
<input class="w-4 h-4 text-secondary focus:ring-secondary border-outline" id="q1-opt1" name="q1-correct" type="radio"/>
<input class="flex-1 bg-transparent border-none p-0 focus:ring-0 font-body-md text-body-md text-on-surface" placeholder="Option A" type="text" value="Component State"/>
<button class="text-outline-variant group-hover:text-outline transition-colors opacity-0 group-hover:opacity-100"><span class="material-symbols-outlined text-[20px]" data-icon="close">close</span></button>
</div>
<!-- Option B -->
<div class="flex items-center gap-md p-sm border border-outline-variant rounded-lg hover:border-secondary-fixed-dim transition-colors group bg-secondary-container/10 border-secondary">
<input checked="" class="w-4 h-4 text-secondary focus:ring-secondary border-outline" id="q1-opt2" name="q1-correct" type="radio"/>
<input class="flex-1 bg-transparent border-none p-0 focus:ring-0 font-body-md text-body-md text-on-surface" placeholder="Option B" type="text" value="Virtual DOM"/>
<button class="text-outline-variant group-hover:text-outline transition-colors opacity-0 group-hover:opacity-100"><span class="material-symbols-outlined text-[20px]" data-icon="close">close</span></button>
</div>
<!-- Option C -->

<input class="w-4 h-4 text-secondary focus:ring-secondary border-outline" id="q1-opt3" name="q1-correct" type="radio"/>
<input class="flex-1 bg-transparent border-none p-0 focus:ring-0 font-body-md text-body-md text-on-surface" placeholder="Option C" type="text"/>
<button class="text-outline-variant group-hover:text-outline transition-colors opacity-0 group-hover:opacity-100"><span class="material-symbols-outlined text-[20px]" data-icon="close">close</span></button>
</div>
<!-- Option D -->
<div class="flex items-center gap-md p-sm border border-outline-variant rounded-lg hover:border-secondary-fixed-dim transition-colors group">
<input class="w-4 h-4 text-secondary focus:ring-secondary border-outline" id="q1-opt4" name="q1-correct" type="radio"/>

<button class="text-outline-variant group-hover:text-outline transition-colors opacity-0 group-hover:opacity-100"><span class="material-symbols-outlined text-[20px]" data-icon="close">close</span></button>
</div>
</div>
