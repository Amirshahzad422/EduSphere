<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>EduSphere - Splash Screen</title>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Google Fonts -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Plus+Jakarta+Sans:wght@600;700&amp;display=swap" rel="stylesheet"/>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind Config -->
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-bright": "#f9f9fb",
                        "on-secondary-fixed": "#002022",
                        "error": "#ba1a1a",
                        "on-surface-variant": "#44474a",
                        "outline": "#75777a",
                        "tertiary-container": "#410006",
                        "inverse-primary": "#c6c6c9",
                        "on-primary-container": "#838486",
                        "surface-container-highest": "#e2e2e5",
                        "surface-container-low": "#f3f3f6",
                        "secondary-container": "#61f4fd",
                        "on-primary-fixed-variant": "#454749",
                        "inverse-surface": "#2f3133",
                        "on-secondary-container": "#006e73",
                        "on-tertiary-container": "#e05456",
                        "primary": "#000101",
                        "on-primary": "#ffffff",
                        "on-secondary-fixed-variant": "#004f53",
                        "on-error": "#ffffff",
                        "surface-tint": "#5d5e61",
                        "surface-container-lowest": "#ffffff",
                        "on-surface": "#1a1c1e",
                        "on-background": "#1a1c1e",
                        "on-tertiary": "#ffffff",
                        "secondary": "#00696e",
                        "surface": "#f9f9fb",
                        "surface-container-high": "#e8e8ea",
                        "secondary-fixed": "#6bf6ff",
                        "outline-variant": "#c5c6ca",
                        "primary-container": "#1a1c1e",
                        "surface-variant": "#e2e2e5",
                        "tertiary-fixed": "#ffdad8",
                        "on-primary-fixed": "#1a1c1e",
                        "primary-fixed": "#e2e2e5",
                        "on-error-container": "#93000a",
                        "on-tertiary-fixed": "#410006",
                        "background": "#f9f9fb",
                        "secondary-fixed-dim": "#3edae3",
                        "tertiary": "#010000",
                        "on-secondary": "#ffffff",
                        "inverse-on-surface": "#f0f0f3",
                        "tertiary-fixed-dim": "#ffb3b0",
                        "primary-fixed-dim": "#c6c6c9",
                        "surface-container": "#edeef0",
                        "error-container": "#ffdad6",
                        "on-tertiary-fixed-variant": "#8c1520",
                        "surface-dim": "#d9dadc"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "margin-desktop": "64px",
                        "base": "8px",
                        "margin-mobile": "20px",
                        "md": "16px",
                        "sm": "12px",
                        "lg": "24px",
                        "gutter-desktop": "24px",
                        "gutter-mobile": "16px",
                        "xs": "4px",
                        "xl": "32px"
                    },
                    "fontFamily": {
                        "label-sm": ["Inter"],
                        "headline-md": ["Plus Jakarta Sans"],
                        "display-lg": ["Plus Jakarta Sans"],
                        "headline-lg-mobile": ["Plus Jakarta Sans"],
                        "body-md": ["Inter"],
                        "headline-lg": ["Plus Jakarta Sans"],
                        "label-md": ["Inter"],
                        "body-lg": ["Inter"],
                        "display-lg-mobile": ["Plus Jakarta Sans"]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .progress-bar-fill {
            animation: loadProgress 2s ease-in-out forwards;
        }
        @keyframes loadProgress {
            0% { width: 0%; }
            100% { width: 100%; }
        }
    </style>
</head>
<body class="bg-primary text-on-primary min-h-screen flex flex-col justify-center items-center overflow-hidden">
<!-- Splash Content Container -->
<main class="flex flex-col items-center justify-center w-full max-w-sm px-margin-mobile text-center h-screen relative">
<!-- Center Logo & Tagline -->
<div class="flex flex-col items-center justify-center flex-1">
<!-- Brand Logo -->
<div class="mb-lg">
<h1 class="font-display-lg-mobile md:font-display-lg text-display-lg-mobile md:text-display-lg text-on-primary">
                    EduSphere
                </h1>
</div>
<!-- Tagline -->
<p class="font-body-lg text-body-lg text-on-primary/80 max-w-[280px]">
                Learn skills. Build confidence. Go further.
            </p>
</div>
<!-- Bottom Loading/Action Area -->
<div class="w-full pb-margin-desktop pt-xl">
<!-- Loading Progress Bar -->
<div class="w-full h-1 bg-surface-tint rounded-full overflow-hidden mb-lg">
<div class="h-full bg-secondary-fixed-dim rounded-full progress-bar-fill"></div>
</div>
<!-- Get Started Button (Appears slightly delayed) -->
<button class="w-full bg-secondary text-on-secondary font-label-md text-label-md py-3 rounded-lg hover:bg-on-secondary-fixed-variant transition-colors duration-300 opacity-0 animate-[fadeIn_0.5s_ease-in_1.8s_forwards]">
                Get Started
            </button>
</div>
</main>
<style>
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</body></html>
